<!doctype html>
<html lang="ru" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Портфолио Ройдева, frontend-разработчика, специализирующегося на React, TypeScript и Tailwind CSS. Откройте для себя мои проекты и навыки в веб-разработке." />
    <meta name="keywords" content="frontend-разработчик, React, TypeScript, Tailwind CSS, портфолио, веб-разработка" />
    <meta name="author" content="Ройдев" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Ройдев - Frontend-разработчик React & TypeScript" />
    <meta property="og:description" content="Портфолио Ройдева, frontend-разработчика, специализирующегося на React, TypeScript и Tailwind CSS. Откройте для себя мои проекты и навыки в веб-разработке." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://roydev-portfolio.com" />
    <meta property="og:site_name" content="Портфолио Ройдева" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ройдев - Frontend-разработчик React & TypeScript" />
    <meta name="twitter:description" content="Портфолио Ройдева, frontend-разработчика, специализирующегося на React, TypeScript и Tailwind CSS. Откройте для себя мои проекты и навыки в веб-разработке." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#E8EEF1" />
    <meta name="msapplication-TileColor" content="#E8EEF1" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon-code.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var savedTheme = localStorage.getItem("theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (e) {}
    </script>

    <title>Ройдев — frontend</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
